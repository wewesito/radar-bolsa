[package]
name = "radar-bolsa"
version = "0.2.0"
description = "Radar Bolsa: análisis bursátil con recomendaciones de un modelo propio"
edition = "2021"

[lib]
name = "radar_bolsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
